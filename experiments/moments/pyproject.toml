[project]
name = "moments-experiments"
version = "0.1.0"
description = "M14: which ML approach finds voice reactions in Steam recordings (throwaway research, not shipped)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "scikit-learn",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
    "librosa",
    "silero-vad",
    "demucs",
    "panns-inference",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
