[package]
name = "steamreplay"
version = "0.2.0"
description = "Find and export the loud moments in Steam game recordings"
authors = ["Nico Jeske"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steamreplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
keyvalues-parser = "0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
dunce = "1"
log = "0.4"
regex = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.53.3", features = ["process", "io-util", "sync", "macros", "rt", "time", "fs"] }
percent-encoding = "2"
tokio-util = "0.7.20"
lru = "0.18.5"
which = "8.0.6"
sha1_smol = { version = "1.0.1", features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
