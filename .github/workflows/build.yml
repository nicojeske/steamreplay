name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the checks only. Windows also builds the installer: that release build
          # warms the Rust cache that release.yml restores (same shared key).
          - os: ubuntu-22.04
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ runner.os }}

      - run: pnpm install --frozen-lockfile
      # tauri-build checks that the externalBin sidecars exist, so this runs before clippy.
      - name: Cache ffmpeg sidecar
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/resources/ffmpeg/LICENSE.txt
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ts') }}
      - name: Fetch ffmpeg sidecar
        if: runner.os == 'Windows'
        run: pnpm fetch-ffmpeg
      - name: Cache laughter model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models/mn10_as.onnx
          key: model-${{ hashFiles('scripts/fetch-model.ts') }}
      - name: Fetch laughter model
        run: pnpm fetch-model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      - name: bindings.ts is up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/bindings.ts

      - run: pnpm lint
      - run: pnpm tsc --noEmit

      - name: tauri build
        if: runner.os == 'Windows'
        # No signing key here; updater artifacts are only built by release.yml.
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: steamreplay-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
