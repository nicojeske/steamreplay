name: release

# `pnpm bump x.y.z` commits and tags; pushing the tag builds a draft release.
# Check the draft, then publish it: the updater only sees published releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Cache ffmpeg sidecar
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/resources/ffmpeg/LICENSE.txt
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ts') }}
      - name: Fetch ffmpeg sidecar
        if: runner.os == 'Windows'
        run: pnpm fetch-ffmpeg

      # Windows code signing (Azure Trusted Signing / signtool) goes here once there is a
      # certificate: set bundle.windows.signCommand or sign the .exe before tauri-action uploads.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SteamReplay ${{ github.ref_name }}
          releaseBody: See the README for install steps. Installed copies update themselves.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}
